name: Deploy design preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Package the synthetic preview only
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re
          sha = os.environ['BUILD_SHA']
          assert re.fullmatch(r'[0-9a-f]{40}', sha)
          html = pathlib.Path('index.html').read_text()
          assert '__BUILD_SHA__' in html
          output = pathlib.Path('_site')
          output.mkdir()
          (output / 'index.html').write_text(html.replace('__BUILD_SHA__', sha))
          (output / 'build.json').write_text(json.dumps({'sha': sha, 'mode': 'synthetic-design-preview'}))
          (output / '.nojekyll').touch()
          PY
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
