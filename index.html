#jinji-canvas{--j-paper:light-dark(#f4f1ea,#191a18);--j-ink:light-dark(#24221e,#f2eee5);--j-muted:light-dark(#6e6a62,#b3aea5);--j-rule:light-dark(#d7d2c8,#45463f);--j-sheet:light-dark(#fdfbf6,#242620);--j-accent:light-dark(#b94228,#e68466);--j-tint:light-dark(#eae4d9,#303129);color:var(--j-ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;font-size:15px;line-height:1.55;width:100%;background:transparent}

#jinji-canvas .j-nav{display:flex;gap:12px}
#jinji-canvas .j-nav button{color:var(--j-muted);border-bottom:2px solid transparent;padding:10px 8px}

#jinji-canvas .j-table th:not(:first-child),#jinji-canvas .j-table td:not(:first-child){text-align:right}
#jinji-canvas .j-site-list{margin-top:24px;border-top:1px solid var(--j-rule)}
#jinji-canvas .j-site-row{display:grid;grid-template-columns:1fr 1fr auto;align-items:center;gap:16px;padding:22px 0!important;width:100%;border-bottom:1px solid var(--j-rule)!important}

#jinji-canvas .j-sheet{position:fixed;inset:0;width:min(640px,calc(100% - 40px));max-width:none;max-height:calc(100dvh - 48px);height:fit-content;padding:0;margin:auto;border:1px solid var(--j-rule);border-radius:18px;background:var(--j-sheet);color:var(--j-ink);box-shadow:0 24px 90px #0004;overflow:hidden;overscroll-behavior:contain}

#jinji-canvas .j-handle{height:3px;width:38px;background:var(--j-rule);border-radius:2px}

/* A stable app frame. Only the current content and an open sheet scroll. */
html,body{height:100%;width:100%;overflow:hidden;overscroll-behavior:none;touch-action:pan-y;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{height:100dvh;padding:12px}
#jinji-canvas{height:100%;display:flex;flex-direction:column;gap:8px;min-height:0;touch-action:pan-y}
#jinji-canvas .j-app{flex:1;min-height:0;display:flex;flex-direction:column}
#jinji-canvas .j-header,#jinji-canvas .j-footer{flex-shrink:0}
#jinji-canvas .j-header{padding:14px 28px}
#jinji-canvas .j-main{min-height:0;flex:1;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-gutter:stable;padding:26px 32px 32px;-webkit-overflow-scrolling:touch}
#jinji-canvas .j-main:has(.j-sheet[open]){overflow-y:hidden}
#jinji-canvas .j-preview-settings{flex-shrink:0;position:relative;z-index:5;font-size:11px;color:var(--j-muted)}
#jinji-canvas .j-preview-settings>summary{display:flex;align-items:center;justify-content:space-between;cursor:pointer;min-height:28px;list-style:none;letter-spacing:.07em}
#jinji-canvas .j-preview-settings>summary::-webkit-details-marker{display:none}
#jinji-canvas .j-preview-settings .j-preview-controls{position:absolute;left:0;right:0;top:30px;box-shadow:0 12px 28px #0002;margin:0}
#jinji-canvas select,#jinji-canvas .j-preview-controls select,#jinji-canvas .j-query{font-size:16px}
#jinji-canvas :focus-visible{outline:2px solid var(--j-accent);outline-offset:3px}
#jinji-canvas .j-line{flex:1;width:100%;min-height:0;overflow-y:auto;overscroll-behavior:contain}
#jinji-canvas .j-status:empty{min-height:0;margin:0}
#jinji-canvas .j-history-entry{display:flex;align-items:center;justify-content:space-between;width:100%;border-top:1px solid var(--j-rule);border-bottom:1px solid var(--j-rule);padding:14px 0;margin-top:24px}

#jinji-canvas .j-year-strip button[aria-pressed=true]{color:var(--j-ink);border-color:var(--j-accent)}
#jinji-canvas .j-filter-row{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0}
#jinji-canvas .j-filter{background:var(--j-tint);border-radius:3px;font-size:14px}

<script>
(()=>{
// Independently invented preview records. No attachment values or entities are used.
const TODAY='2026-09-22';
const memberIds=['1','2','3'];
const equalSplit=()=>[1/3,1/3,1/3];
const sites=Array.from({length:18},(_,i)=>({id:String.fromCharCode(65+i),name:`示範場 ${String.fromCharCode(65+i)}`,grower:`g${Math.floor(i/3)+1}`,standard:['C','Q'].includes(String.fromCharCode(65+i))?null:10000+i*800}));
const growers=Array.from({length:6},(_,i)=>({id:`g${i+1}`,name:`示範代養主${['甲','乙','丙','丁','戊','己'][i]}`,sites:sites.filter(s=>s.grower===`g${i+1}`).map(s=>s.id)}));
const configurations={};
sites.forEach((s,i)=>{
 const initial=i<3?.2:[.12,.18,.24,.3][i%4];
 const versions=[{id:`${s.id}-v1`,date:'2023-01-01',fromYear:2023,fromN:1,pool:initial,split:equalSplit()}];
 if(i>=3)versions.push({id:`${s.id}-v2`,date:'2025-01-01',fromYear:2025,fromN:1,pool:initial+.03,split:i%2?[.4,.35,.25]:equalSplit()});
 if(s.id==='B')versions.push({id:'B-v2',date:'2026-08-01',fromYear:2026,fromN:3,pool:.25,split:equalSplit()});
 else if(i>=3&&i%3===0)versions.push({id:`${s.id}-v3`,date:'2026-07-01',fromYear:2026,fromN:3,pool:initial+.06,split:[.5,.3,.2]});
 configurations[s.id]=versions;
});
const versionFor=(site,year,n)=>configurations[site].filter(v=>v.fromYear<year||(v.fromYear===year&&v.fromN<=n)).at(-1);
const legacy=[
 ['A',1,'2024-03-12',260000],['B',1,'2024-06-24',-140000],['C',1,'2024-11-08',340000],
 ['A',1,'2025-02-08',380000],['B',1,'2025-03-18',-160000],['C',1,'2025-05-06',290000],['A',2,'2025-07-16',460000],['B',2,'2025-09-23',180000],['C',2,'2025-12-14',-110000],
 ['A',1,'2026-01-09',480000],['B',1,'2026-02-14',-240000],['C',1,'2026-03-21',360000],['A',2,'2026-04-07',0],['B',2,'2026-05-19',600000],['C',2,'2026-06-18',-180000],['A',3,'2026-07-26',420000],['C',3,'2026-09-06',320000]
];
const records=[];
function addRecord(site,n,date,farm,i){
 const year=+date.slice(0,4),v=versionFor(site,year,n),payout=new Date(date+'T00:00:00Z');payout.setUTCDate(payout.getUTCDate()+14);
 const expense=site==='C'&&date==='2026-09-06'?1000:site==='A'&&date==='2026-07-26'?600:site==='C'&&date==='2025-12-14'?1200:i%5===0?1800:0;
 records.push({id:`${site}-${year}-${n}`,site,n,date,payoutDate:payout.toISOString().slice(0,10),farm,expense,snapshot:Object.freeze({version:v.id,pool:v.pool,split:Object.freeze([...v.split]),fromYear:v.fromYear,fromN:v.fromN}),note:expense?'虛構分配支出示例':'虛構零支出示例'});
}
legacy.forEach((r,i)=>addRecord(...r,i+1));
sites.forEach((s,i)=>{for(let year=2023;year<=2026;year++){if(i<3&&year>2023)continue;for(let n=1;n<=3;n++){
 const month=n===1?'03':n===2?'07':year===2026?'09':'12';
 const day=String(year===2026?3+(i+n)%6:n===3?19+i%7:8+(i*3+n)%17).padStart(2,'0');
 const code=i*19+(year-2023)*7+n*11;
 const farm=code%9===0?0:code%4===0?-(100000+(code%8)*26000):210000+(code%15)*29000;
 addRecord(s.id,n,`${year}-${month}-${day}`,farm,code);
}}});
records.sort((a,b)=>b.date.localeCompare(a.date)||a.site.localeCompare(b.site));
const operations=records.map((c,i)=>{
 const missing=(i%7===0)||(c.site==='R'&&c.date.startsWith('2026'));
 const chicks=11000+(c.site.charCodeAt(0)%7)*1600,shipped=Math.round(chicks*(.865+(i%11)*.009));
 const weight=shipped*(2.05+(i%6)*.11);
 return {id:c.id,site:c.site,grower:sites.find(s=>s.id===c.site).grower,date:c.date,updatedAt:c.date,chicks:missing?null:chicks,shipped:missing?null:shipped,weight:missing||i%5===0?null:weight,feed:missing||i%5===0?null:weight*(2.14+(i%9)*.047)};
});
const issues=[
 {id:'conflict',name:'權威資料衝突',sites:['A'],summary:'示範場 A 的來源比例與目前配置不同。',detail:'目前共同占比 20%，虛構來源列出 25%。來源比例的語意與生效水次仍需核對；既有有效設定及歷史快照維持原值。'},
 {id:'unmapped',name:'財務列尚未對應水次',sites:['F'],summary:'1 筆財務列保留在帳務暫存。',detail:'虛構發錢日 2026-09-02、來源金額 +18,000。未确认結算日或水次身份，故不計入已結算水數與正式績效。'},
 {id:'risk',name:'風險資料缺欄',sites:['C','Q'],summary:'2 場缺少約定標準飼養數。',detail:'示範場 C、Q 未納入靜態風險總額；盈虧與分配查詢仍可使用。缺值不視為零曝險。'},
 {id:'import',name:'匯入異常',sites:['J'],summary:'虛構批次 004 有 1 列日期格式無法辨識。',detail:'該列已隔離在匯入暫存，未覆蓋有效資料。需核對來源日期；不將公式空白列當成新水次。'},
 {id:'stale',name:'補充營運資料過舊',sites:['R'],summary:'示範場 R 的 2026 年營運輸入尚未取得。',detail:'保留歷史補充資料及原始日期，不覆蓋為零。2026 年育成率及 FCR 顯示尚無資料，財務記錄仍正常呈現。'}
].map(x=>({...x,detail:x.detail.replace('确认','確認')}));
const sum=(arr,fn=x=>x)=>arr.reduce((n,x)=>n+fn(x),0);
const money=n=>Math.abs(n).toLocaleString('en-US',{maximumFractionDigits:2});
const signed=n=>(n<0?'−':n>0?'+':'')+money(n);
const pct=n=>Number((n*100).toFixed(2))+'%';
const pool=c=>Math.round(c.farm*c.snapshot.pool);
const net=c=>pool(c)-c.expense;
const amount=(c,ctx)=> (ctx.basis==='net'?net(c):pool(c))*(ctx.owner==='pool'?1:c.snapshot.split[Number(ctx.owner)-1]);
const siteIds=scope=>scope==='all'?sites.map(s=>s.id):growers.find(g=>g.id===scope)?.sites||[scope];
const scopeName=scope=>scope==='all'?'全部場地':growers.find(g=>g.id===scope)?.name||sites.find(s=>s.id===scope)?.name||'全部場地';
const ownerName=owner=>owner==='pool'?'Sales Pool':`參與者${owner}`;
const periodName=ctx=>(ctx.year==='all'?'全部年度':ctx.year+' 年')+(ctx.month?' · '+ctx.month+' 月':'');
const contextRows=(ctx,ignoreMonth=false)=>records.filter(c=>siteIds(ctx.scope).includes(c.site)&&(ctx.year==='all'||c.date.startsWith(ctx.year))&&(ignoreMonth||ctx.month===null||+c.date.slice(5,7)===ctx.month));
const cutoff=ctx=>ctx.year==='all'?TODAY:ctx.month?`${ctx.year}-${String(ctx.month).padStart(2,'0')}-${new Date(+ctx.year,+ctx.month,0).getDate()}`:ctx.year==='2026'?TODAY:ctx.year+'-12-31';
const configAt=(site,ctx)=>configurations[site].filter(v=>v.date<=cutoff(ctx)).at(-1)||configurations[site][0];
function operatingStats(rows){const s=rows.filter(r=>r.chicks>0&&r.shipped!==null),f=rows.filter(r=>r.weight>0&&r.feed!==null);return {survival:s.length?sum(s,r=>r.shipped)/sum(s,r=>r.chicks)*100:null,fcr:f.length?sum(f,r=>r.feed)/sum(f,r=>r.weight):null,sN:s.length,fN:f.length,total:rows.length,complete:rows.filter(r=>r.chicks>0&&r.shipped!==null&&r.weight>0&&r.feed!==null).length,shipped:sum(s,r=>r.shipped),chicks:sum(s,r=>r.chicks),feed:sum(f,r=>r.feed),weight:sum(f,r=>r.weight),latest:rows.filter(r=>r.chicks!==null||r.feed!==null).map(r=>r.date).sort().at(-1)||null};}
function timelineNodes(site,ctx){
 const rows=contextRows({...ctx,scope:site}).slice().reverse();
 const nodes=rows.map(c=>({key:c.id,date:c.date,title:`${c.date} · 第 ${c.n} 水`,allocation:c.snapshot,record:c.id,kind:'已結算快照'}));
 configurations[site].filter(v=>v.date<=cutoff(ctx)&&(ctx.year==='all'||v.date.startsWith(ctx.year))&&(ctx.month===null||+v.date.slice(5,7)===ctx.month)).forEach(v=>nodes.push({key:v.id,date:v.date,title:`${v.fromYear} 年第 ${v.fromN} 水起`,allocation:v,kind:'配置生效'}));
 nodes.sort((a,b)=>a.date.localeCompare(b.date)||a.key.localeCompare(b.key));
 const v=configAt(site,ctx);nodes.push({key:'period-end',date:cutoff(ctx),title:`截至 ${cutoff(ctx)}`,allocation:v,kind:cutoff(ctx)===TODAY?'目前有效配置':'期間末配置'});
 return nodes;
}

const root=document.getElementById('jinji-canvas'),q=s=>root.querySelector(s),qa=s=>[...root.querySelectorAll(s)];
const ctxDefault={scope:'all',year:'2026',owner:'pool',month:null,basis:'pool'};
const state={page:'overview',view:'returns',ctx:{...ctxDefault},opView:'sites',opYear:'2026',selected:{},timeline:{},scroll:{},rail:0,design:{surface:'pwa',appearance:'auto',accent:'cinnabar'}};
const clone=x=>JSON.parse(JSON.stringify(x));
function restore(){try{const saved=JSON.parse(localStorage.getItem('jinji-preview-ui-v3'));if(saved){if(['overview','portfolio','operations'].includes(saved.page))state.page=saved.page;if(['returns','allocation'].includes(saved.view))state.view=saved.view;if(saved.ctx){const c=saved.ctx;if(['all',...sites.map(s=>s.id),...growers.map(g=>g.id)].includes(c.scope))state.ctx.scope=c.scope;if(['all','2023','2024','2025','2026'].includes(c.year))state.ctx.year=c.year;if(['pool',...memberIds].includes(c.owner))state.ctx.owner=c.owner;if(c.month===null||Number.isInteger(c.month)&&c.month>=1&&c.month<=12)state.ctx.month=c.month;if(['pool','net'].includes(c.basis))state.ctx.basis=c.basis;}if(['sites','growers'].includes(saved.opView))state.opView=saved.opView;if(['all','2023','2024','2025','2026'].includes(saved.opYear))state.opYear=saved.opYear;['selected','timeline','scroll'].forEach(k=>{if(saved[k]&&typeof saved[k]==='object'&&!Array.isArray(saved[k]))state[k]=saved[k];});if(Number.isFinite(saved.rail))state.rail=saved.rail;if(saved.design)Object.assign(state.design,saved.design);}
 else {const old=JSON.parse(localStorage.getItem('jinji-preview-ui-v2'))?.modelContent;if(old){state.page=['history','investment'].includes(old.page)?'portfolio':old.page==='ratings'?'operations':'overview';state.view=old.page==='investment'?'allocation':'returns';if(['all','A','B','C'].includes(old.historyScope))state.ctx.scope=old.historyScope;if(['all','2024','2025','2026'].includes(old.historyYear))state.ctx.year=old.historyYear;if(['pool',...memberIds].includes(old.historyOwner))state.ctx.owner=old.historyOwner;['appearance','accent','surface'].forEach(k=>{if(old[k])state.design[k]=old[k];});}}
 if(!['pwa','line'].includes(state.design.surface))state.design.surface='pwa';if(!['auto','light','dark'].includes(state.design.appearance))state.design.appearance='auto';if(!['cinnabar','olive'].includes(state.design.accent))state.design.accent='cinnabar';
}catch{}}
const persist=()=>{try{localStorage.setItem('jinji-preview-ui-v3',JSON.stringify(state));}catch{}};
const scrollKey=()=>state.page==='portfolio'?`${state.page}:${state.view}:${JSON.stringify(state.ctx)}`:state.page==='operations'?`operations:${state.opYear}:${state.opView}`:state.page;
const capture=()=>{state.scroll[scrollKey()]=q('.j-main').scrollTop;const rail=q('.p-rail');if(rail)state.rail=rail.scrollLeft;};
const backTrail=[];let restoring=false;
function transition(fn){capture();backTrail.push(clone(state));if(backTrail.length>40)backTrail.shift();fn();render();persist();}
function goBack(){if(modal){modalBack();return;}if(!backTrail.length)return;capture();Object.assign(state,backTrail.pop());render();persist();q('#j-status').textContent='已返回上一個查看範圍';}
function changeContext(next){transition(()=>Object.assign(state.ctx,next));}
function goPortfolio(next={}){transition(()=>{state.page='portfolio';Object.assign(state.ctx,next);});}
const btn=(action,label,value='',extra='')=>`<button data-action="${action}" data-value="${value}" data-key="${action}-${value}" ${extra}>${label}</button>`;
const caption=text=>`<span class="j-caption">${text}</span>`;
const viewLabel=()=>state.view==='returns'?'收益':'配置';
function render(){
 const focused=document.activeElement?.dataset?.key;
 qa('[data-view]').forEach(e=>e.hidden=e.dataset.view!==state.page);
 qa('.j-nav button').forEach(e=>e.setAttribute('aria-pressed',String(e.dataset.value===state.page)));
 if(state.page==='overview')q('#p-overview').innerHTML=overviewHTML();
 if(state.page==='portfolio')q('#p-portfolio').innerHTML=portfolioHTML();
 if(state.page==='operations')q('#p-operations').innerHTML=operationsHTML();
 const d=state.design;root.style.colorScheme=d.appearance==='auto'?'light dark':d.appearance;document.documentElement.style.colorScheme=root.style.colorScheme;root.style.setProperty('--j-accent',d.accent==='olive'?'light-dark(#626b35,#bcc784)':'light-dark(#b94228,#e68466)');
 q('.j-app').hidden=d.surface==='line';q('.j-line').hidden=d.surface!=='line';['surface','appearance','accent'].forEach(k=>q('#j-preview-'+k).value=d[k]);if(d.surface==='line')renderLine();
 restoring=true;q('.j-main').scrollTop=Number(state.scroll[scrollKey()])||0;const rail=q('.p-rail');if(rail)rail.scrollLeft=state.rail;restoring=false;
 if(focused)q(`[data-key="${CSS.escape(focused)}"]`)?.focus({preventScroll:true});
}
function overviewHTML(){
 const rows=contextRows(ctxDefault),best=rows.reduce((a,b)=>a.farm>b.farm?a:b),worst=rows.reduce((a,b)=>a.farm<b.farm?a:b),wins=rows.filter(c=>c.farm>0).length;
 return `<div class="j-eyebrow">THE BIG PICTURE / 2026</div><div class="p-overview-grid"><div><h2 class="j-title">今年，累積。</h2><div class="p-result-top"><span class="j-label">18 場 · 已結算 Pool 盈虧</span>${btn('lens','解讀此處 ↗','overview','class="p-lens-trigger"')}</div><div class="p-amount" id="p-overview-total" data-lens="overview">${signed(sum(rows,pool))}<small>NT$</small></div><div class="p-metrics"><div><b>${rows.length}</b><span>水已結算</span></div><div><b>${pct(wins/rows.length)}</b><span>獲利水比例 · 整場</span></div><div><b>18</b><span>水進行中</span></div></div>${btn('ongoing','進行中水次 ↗','','class="j-current"')}<div class="j-caption">長按數字，帶著目前範圍解讀。</div>${btn('portfolio',`<span><b>進入收益</b><small>${scopeName(state.ctx.scope)} · ${periodName(state.ctx)} · ${ownerName(state.ctx.owner)}</small></span><span>↗</span>`,'','class="j-history-entry"')}</div><aside class="p-overview-side">${btn('cycle',`<span class="j-label">最佳單水 · 整場</span><strong>${signed(best.farm)}</strong><span class="j-caption">示範場 ${best.site} · 第 ${best.n} 水 / Pool ${signed(pool(best))} ↗</span>`,best.id)}${btn('cycle',`<span class="j-label">最差單水 · 整場</span><strong>${signed(worst.farm)}</strong><span class="j-caption">示範場 ${worst.site} · 第 ${worst.n} 水 / Pool ${signed(pool(worst))} ↗</span>`,worst.id)}</aside></div><div class="p-overview-footer"><div><div class="j-section-heading"><span>最近結算</span>${caption('原位展開，不離開總覽')}</div>${records.slice(0,3).map(c=>recordButton(c,ctxDefault)).join('')}</div><div>${btn('risk',`<span><b>目前配置風險</b><small>16 場可計算 · 2 場待補標準飼養數</small></span><span>↗</span>`,'','class="j-history-entry"')}<p class="j-caption">無本金的盈虧參與模式。進行中水次不估列收益；財務列需確認水次與結算日後才納入正式績效。</p></div></div>`;
}

function returnsHTML(){const c=state.ctx,rows=contextRows(c),positive=rows.filter(r=>amount(r,c)>0),negative=rows.filter(r=>amount(r,c)<0),groups=[...new Set(rows.map(r=>r.date.slice(0,7)))];return `<div class="p-columns"><div class="p-sticky-result"><div class="p-result"><div class="p-result-top"><div class="p-basis" aria-label="收益金額口徑">${btn('basis','分配盈虧','pool',`aria-pressed="${c.basis==='pool'}"`)}${btn('basis','支出後淨收入','net',`aria-pressed="${c.basis==='net'}"`)}</div>${btn('lens','解讀此處 ↗','returns','class="p-lens-trigger"')}</div><div class="j-caption" id="p-result-label">${scopeName(c.scope)} · ${periodName(c)} · ${ownerName(c.owner)}</div><div class="p-amount" id="p-return-total" data-lens="returns">${signed(sum(rows,r=>amount(r,c)))}<small>NT$</small></div><div class="p-metrics"><div><b>${rows.length}</b><span>水已結算</span></div><div><b>${positive.length} / ${negative.length}</b><span>獲利 / 虧損水</span></div></div><div class="j-caption">獲利 ${signed(sum(positive,r=>amount(r,c)))} · 虧損 ${signed(sum(negative,r=>amount(r,c)))} · 打平 ${rows.length-positive.length-negative.length} 水</div>${monthlyHTML(c)}<div class="j-caption">依結算日歸屬 · 發錢日另列於每水明細。</div>${btn('period-ledger','完整期間帳務 ↗','','class="j-current"')}${contextIssueHTML()}</div></div><div class="p-ledger" id="p-ledger-list">${rows.length?groups.map(g=>`<h3>${g.replace('-',' / ')}<span>${signed(sum(rows.filter(r=>r.date.startsWith(g)),r=>amount(r,c)))} 元</span></h3>${rows.filter(r=>r.date.startsWith(g)).map(r=>recordButton(r,c)).join('')}`).join(''):'<div class="p-empty">這個範圍沒有已確認的結算水次。可調整年度或場地；暫存財務列不計入績效。</div>'}</div></div>`;}
function contextIssueHTML(){if(state.ctx.scope==='all')return '';const affected=issues.filter(i=>i.sites.some(s=>siteIds(state.ctx.scope).includes(s)));return affected.length?btn('context-issues',`${scopeName(state.ctx.scope)} · ${affected.length} 項資料狀態需留意 ↗`,'','class="p-context-issue"'):'';}
function shareTable(a,owner=state.ctx.owner){return `<table class="p-share-table"><thead><tr><th>參與者</th><th>Pool 內比例</th><th>個人占整場</th></tr></thead><tbody>${memberIds.map((id,i)=>`<tr data-selected="${owner===id}"><td>參與者${id}</td><td>${pct(a.split[i])}${a.split[i]===1/3?'<small>精確 1/3</small>':''}</td><td>${pct(a.pool*a.split[i])}</td></tr>`).join('')}</tbody></table>`;}

const timelineKey=site=>`${site}:${state.ctx.year}:${state.ctx.month||'all'}`;
function selectedNode(site,nodes){const remembered=state.timeline[timelineKey(site)]||state.selected[site];return nodes.find(n=>n.key===remembered)||nodes.at(-1);}

function moveTimeline(index){const input=q('#p-ratio-timeline');if(!input)return;const site=input.dataset.site,nodes=timelineNodes(site,state.ctx),i=Math.max(0,Math.min(nodes.length-1,index)),node=nodes[i];state.timeline[timelineKey(site)]=node.key;if(node.record)state.selected[site]=node.record;input.value=i;input.setAttribute('aria-valuetext',`${node.title}，${node.kind}，Pool ${pct(node.allocation.pool)}`);q('#p-timeline-count').textContent=`${i+1} / ${nodes.length}`;q('#p-allocation-snapshot').innerHTML=allocationSnapshotHTML(node,site);qa('[data-action="timeline-step"]').forEach(b=>b.disabled=+b.dataset.value<0?i===0:i===nodes.length-1);persist();}

let modal=null,modalTrail=[],origin=null,audit='本次沒有示範更正。';

function lensHTML(m){const {ctx,kind}=m.context,op=m.context.op;const questions=op?[['op-survival','育成率怎麼算？'],['op-fcr','FCR 的依據是什麼？'],['op-missing','哪些營運資料還不完整？']]:[['change',ctx.month?'為什麼這個月變動？':'最近一個月為什麼變動？'],['recent',ctx.scope==='all'?'最近的水次表現如何？':scopeName(ctx.scope)+' 最近怎樣？'],['ratio','比例改變影響多少？'],['drag','哪幾水拖累表現？']];const answer=m.question?lensAnswer(m.context,m.question):null;return `<div class="j-eyebrow">CONTEXTUAL AI LENS / 本地示範</div><h3>沿著現在的數字，看清楚。</h3><div class="p-lens-context"><span>${scopeName(ctx.scope)}</span><span>${periodName(ctx)}</span><span>${ownerName(ctx.owner)}</span><span>${kind==='allocation'?'配置':op?'營運表現':ctx.basis==='net'?'支出後淨收入':'分配盈虧'}</span>${m.context.record?`<span>第 ${records.find(r=>r.id===m.context.record).n} 水</span>`:''}${m.context.node?`<span>${m.context.node.title}</span>`:''}</div><div class="p-lens-questions">${questions.map(([id,label])=>btn('lens-question',`<span>${label}</span><span>${m.question===id?'−':'↗'}</span>`,id)).join('')}</div>${answer?`<div class="p-lens-answer" id="p-lens-answer">${answer.text}</div>${answer.rows?.map(c=>btn('lens-evidence',`<span>${c.date} · 場 ${c.site} 第 ${c.n} 水</span><span>${signed(amount(c,ctx))} ↗</span>`,c.id,'class="p-issue"')).join('')||''}`:'<p class="j-caption">已帶入目前範圍，不需要重打場名與期間。</p>'}<p class="j-caption">此版本以已計算的虛構資料示範上下文解讀，尚未呼叫 Cloudflare AI；無資料支持的營運原因不推測。</p>`;}
function lensAnswer(context,question){const ctx=context.ctx;let rows=contextRows(ctx);if(context.record)rows=records.filter(c=>c.id===context.record);if(question.startsWith('op-')){const op=context.op,v=operatingStats(opRows(op.kind,op.id,op.year));return {text:question==='op-survival'?(v.sN?`育成率 ${v.survival.toFixed(2)}%，由 ${money(v.shipped)} 隻出雞 ÷ ${money(v.chicks)} 隻入雞計算，納入 ${v.sN} 水。`:'本期間沒有足以計算育成率的補充輸入。'):question==='op-fcr'?(v.fN?`FCR ${v.fcr.toFixed(2)}，由飼料 ${money(v.feed)} kg ÷ 活重 ${money(v.weight)} kg 計算，納入 ${v.fN} 水。`:'本期間沒有足以計算 FCR 的飼料／活重資料。'):`${v.total} 水中，${v.complete} 水具備兩項指標的必要輸入；育成率缺 ${v.total-v.sN} 水，FCR 缺 ${v.total-v.fN} 水。財務結果仍可單獨查閱，缺營運資料不等於表現為零。`};}
 if(question==='drag'){const negative=rows.filter(c=>amount(c,ctx)<0).sort((a,b)=>amount(a,ctx)-amount(b,ctx)).slice(0,3);return {text:negative.length?`目前範圍內，拖累較大的 ${negative.length} 水合計 ${signed(sum(negative,c=>amount(c,ctx)))} 元。以下按所選金額口徑排序；這是結果分解，不能單憑財務數字判定飼養原因。`:'目前範圍沒有虧損水；尚未對應水次的財務列未納入。',rows:negative};}
 if(question==='recent'){const latest=(context.node?rows.filter(c=>c.date<=context.node.date):rows).slice(0,3);return {text:latest.length?`${context.node?'截至 '+context.node.date+'，':''}目前範圍最近 ${latest.length} 水合計 ${signed(sum(latest,c=>amount(c,ctx)))} 元；${latest.filter(c=>amount(c,ctx)>0).length} 水獲利、${latest.filter(c=>amount(c,ctx)<0).length} 水虧損。`:'此範圍尚無已確認結算水次。',rows:latest};}
 if(question==='change'){const base=contextRows(ctx,true);if(!base.length)return {text:'此範圍尚無已確認結算，無法比較月份。'};const key=context.node?context.node.date.slice(0,7):ctx.month&&ctx.year!=='all'?`${ctx.year}-${String(ctx.month).padStart(2,'0')}`:base[0].date.slice(0,7);const date=new Date(key+'-01T00:00:00Z');date.setUTCMonth(date.getUTCMonth()-1);const prevKey=date.toISOString().slice(0,7),current=records.filter(c=>siteIds(ctx.scope).includes(c.site)&&c.date.startsWith(key)),previous=records.filter(c=>siteIds(ctx.scope).includes(c.site)&&c.date.startsWith(prevKey));const now=sum(current,c=>amount(c,ctx)),before=sum(previous,c=>amount(c,ctx));return {text:`${key} 合計 ${signed(now)} 元，來自 ${current.length} 水。${previous.length?`相較 ${prevKey} 的 ${signed(before)} 元，變動 ${signed(now-before)} 元。`:`${prevKey} 沒有結算紀錄，因此不推算比較增幅。`}較大的金額貢獻列於下方；仍需營運證據才能說明成因。`,rows:current.slice().sort((a,b)=>Math.abs(amount(b,ctx))-Math.abs(amount(a,ctx))).slice(0,3)};}

 return {text:'請選擇目前範圍的解讀方向。'};

 case 'view':if(state.view!==value)transition(()=>state.view=value);break;
 case 'scope':if(state.ctx.scope!==value)changeContext({scope:value});break;
 case 'year':choices('year','選擇查閱年度',[['2026','2026 年'],['2025','2025 年'],['2024','2024 年'],['2023','2023 年'],['all','全部年度']],state.ctx.year);break;
 case 'owner':choices('owner','查看誰的分配',[['pool','Sales Pool · 三位參與者'],['1','參與者1'],['2','參與者2'],['3','參與者3']],state.ctx.owner);break;
 case 'year-direct':changeContext({year:value,month:null});break;
 case 'month':changeContext({month:state.ctx.month===+value?null:+value});break;
 case 'month-clear':changeContext({month:null});break;
 case 'basis':changeContext({basis:value});break;
 case 'choice':{const kind=modal.kind;closeModal();if(kind==='year')changeContext({year:value,month:null});if(kind==='owner')changeContext({owner:value});if(kind==='op-year')transition(()=>state.opYear=value);break;}
 case 'cycle':openCycle(value);break;
 case 'cycle-step':cycleStep(+value);break;
 case 'cycle-tab':{modal.tabScroll[modal.tab]=q('#j-sheet-content').scrollTop;modal.tab=value;modal.scroll=modal.tabScroll[value]||0;renderModal();break;}
 case 'cycle-portfolio':{const c=records.find(r=>r.id===value),ctx=clone(modal.ctx);closeModal();transition(()=>{state.page='portfolio';state.view='allocation';Object.assign(state.ctx,ctx,{scope:c.site});state.timeline[timelineKey(c.site)]=c.id;});break;}
 case 'timeline-step':moveTimeline(+q('#p-ratio-timeline').value+(+value));break;
 case 'period-ledger':showModal({type:'ledger',ctx:clone(state.ctx)});break;
 case 'issues':showModal({type:'issues'});break;
 case 'context-issues':showModal({type:'issues',scope:state.ctx.scope});break;
 case 'issue':showModal({type:'issue',id:value});break;
 case 'issue-site':closeModal();goPortfolio({scope:value});break;
 case 'fields':showModal({type:'fields'});break;
 case 'sample':showModal({type:'sample'});break;
 case 'risk':showModal({type:'risk'});break;
 case 'ongoing':showModal({type:'ongoing'});break;
 case 'op-year':choices('op-year','營運資料年度',[['2026','2026 年'],['2025','2025 年'],['2024','2024 年'],['2023','2023 年'],['all','全部年度']],state.opYear);break;
 case 'op-view':transition(()=>state.opView=value);break;
 case 'op-detail':{const [kind,id]=value.split(':');showModal({type:'op',kind,id,year:state.opYear});break;}
 case 'op-portfolio':{const year=modal.year;closeModal();transition(()=>{state.page='portfolio';state.view='returns';Object.assign(state.ctx,{scope:value,year,month:null});});break;}
 case 'lens':showModal({type:'lens',context:lensContext(value),question:null});break;
 case 'lens-question':modal.question=value;modal.scroll=0;renderModal();break;
 case 'lens-evidence':{const rows=lensAnswer(modal.context,modal.question).rows||[];openCycle(value,rows.map(c=>c.id));break;}
 case 'line-pwa':transition(()=>{state.design.surface='pwa';state.page='portfolio';});break;
 case 'edit':showModal({type:'edit',id:value});break;
 case 'edit-preview':{const text=q('#p-edit-farm').value.trim(),number=Number(text);if(!text||!Number.isSafeInteger(number)){q('#j-sheet-status').textContent='請輸入有效的整數金額。';return;}const c=records.find(r=>r.id===value);if(c.farm===number){q('#j-sheet-status').textContent='沒有變更。';return;}showModal({type:'edit-confirm',id:value,value:number});break;}
 case 'edit-apply':{const c=records.find(r=>r.id===value),old=c.farm;c.farm=modal.value;audit=`示範場 ${c.site} ${c.date}：整場 ${signed(old)} → ${signed(c.farm)}，衍生金額已重算。`;closeModal();render();q('#j-status').textContent='已更新虛構示範金額，重新整理即還原。';break;}
 }
});
root.addEventListener('input',e=>{if(e.target.id==='p-ratio-timeline')moveTimeline(+e.target.value);});
q('#j-close').onclick=closeModal;q('#j-sheet-back').onclick=modalBack;
q('#j-sheet').addEventListener('cancel',e=>{e.preventDefault();closeModal();});
q('#j-sheet').addEventListener('keydown',e=>{if(e.key!=='Tab')return;const nodes=[...q('#j-sheet').querySelectorAll('button:not(:disabled),input:not(:disabled),select:not(:disabled),a[href]')].filter(n=>n.getClientRects().length),first=nodes[0],last=nodes.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus({preventScroll:true});}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus({preventScroll:true});}});
let backdrop=false;const outside=e=>{const r=q('#j-sheet').getBoundingClientRect();return e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom;};
q('#j-sheet').addEventListener('pointerdown',e=>backdrop=e.target===q('#j-sheet')&&outside(e));q('#j-sheet').addEventListener('pointerup',e=>{if(backdrop&&e.target===q('#j-sheet')&&outside(e))closeModal();backdrop=false;});
let sheetDrag=null;
q('#j-sheet-handle').addEventListener('pointerdown',e=>{if(!e.isPrimary||e.button!==0||e.target.closest('button'))return;sheetDrag={id:e.pointerId,y:e.clientY};q('#j-sheet-handle').setPointerCapture(e.pointerId);});
q('#j-sheet-handle').addEventListener('pointermove',e=>{if(sheetDrag?.id===e.pointerId)q('#j-sheet').style.transform=`translateY(${Math.max(0,Math.min(160,e.clientY-sheetDrag.y))}px)`;});
q('#j-sheet-handle').addEventListener('pointerup',e=>{if(sheetDrag?.id!==e.pointerId)return;const dy=e.clientY-sheetDrag.y;sheetDrag=null;q('#j-sheet').style.transform='';if(dy>64)closeModal();});
q('#j-sheet-handle').addEventListener('pointercancel',()=>{sheetDrag=null;q('#j-sheet').style.transform='';});
let horizontal=null,hold=null;
function cancelHold(){if(hold)clearTimeout(hold.timer);hold=null;}
root.addEventListener('pointerdown',e=>{
 if(!e.isPrimary||e.button!==0)return;
 if(e.target.id==='p-back-edge')horizontal={kind:'back',id:e.pointerId,x:e.clientX,y:e.clientY};
 else if(modal?.type==='cycle'&&e.target.closest('#p-cycle-body')&&!e.target.closest('button,input'))horizontal={kind:'cycle',id:e.pointerId,x:e.clientX,y:e.clientY};
 const target=e.target.closest('[data-lens]');if(!target)return;cancelHold();hold={id:e.pointerId,x:e.clientX,y:e.clientY,timer:setTimeout(()=>{suppressClickUntil=Date.now()+600;const context=lensContext(target.dataset.lens);cancelHold();showModal({type:'lens',context,question:null});},550)};
});
root.addEventListener('pointermove',e=>{if(hold?.id===e.pointerId&&(Math.abs(e.clientX-hold.x)>8||Math.abs(e.clientY-hold.y)>8))cancelHold();if(horizontal?.id===e.pointerId&&Math.abs(e.clientY-horizontal.y)>30)horizontal=null;});
root.addEventListener('pointerup',e=>{cancelHold();if(horizontal?.id===e.pointerId){const dx=e.clientX-horizontal.x,dy=e.clientY-horizontal.y,kind=horizontal.kind;horizontal=null;if(Math.abs(dx)>75&&Math.abs(dx)>Math.abs(dy)*1.7){if(kind==='back'&&dx>0)goBack();if(kind==='cycle')cycleStep(dx<0?1:-1);}}});
root.addEventListener('pointercancel',()=>{cancelHold();horizontal=null;});
q('.j-main').addEventListener('scroll',()=>{if(!restoring)state.scroll[scrollKey()]=q('.j-main').scrollTop;},{passive:true});
root.addEventListener('scroll',e=>{if(e.target.matches?.('.p-rail'))state.rail=e.target.scrollLeft;},true);
window.addEventListener('pagehide',persist);document.addEventListener('visibilitychange',()=>{if(document.hidden)persist();});
['gesturestart','gesturechange'].forEach(type=>document.addEventListener(type,e=>e.preventDefault(),{passive:false}));document.addEventListener('wheel',e=>{if(e.ctrlKey)e.preventDefault();},{passive:false});
['surface','appearance','accent'].forEach(k=>q('#j-preview-'+k).onchange=e=>{capture();state.design[k]=e.target.value;render();persist();});
restore();render();

})();
</script>
</body>
</html>
